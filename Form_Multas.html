<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        
        /* Ajustes de Select2 para que coincida con Tailwind y sea táctil (Móvil) */
        .select2-container .select2-selection--single {
            height: 42px !important; /* Más alto para que sea fácil de tocar en celular */
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 40px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 40px !important;
            color: #374151 !important; 
            padding-left: 0.75rem !important;
        }
        .select2-dropdown {
            border-radius: 0.375rem !important;
            border: 1px solid #d1d5db !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
    </style>
</head>
<body class="p-4 md:p-6 bg-gray-50 min-h-screen flex justify-center">

<div class="w-full max-w-md bg-white shadow-xl rounded-lg p-6 border-t-4 border-indigo-600 h-fit">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Registro de Multa</h1>
    
    <div id="messages" class="mb-4"></div>

    <form id="fineForm" onsubmit="submitFine(event)" class="space-y-5">
        
        <div>
            <label for="idUnidad" class="block text-sm font-bold text-gray-700 mb-1">Unidad/Departamento</label>
            <select id="idUnidad" name="idUnidad" required class="w-full">
                <option value="">Cargando unidades...</option>
            </select>
        </div>

        <div>
            <label for="idMulta" class="block text-sm font-bold text-gray-700 mb-1">Tipo de Multa</label>
            <select id="idMulta" name="idMulta" required class="w-full">
                <option value="">Cargando multas...</option>
            </select>
            <div id="fineDetails" class="mt-2 p-3 bg-indigo-50 text-indigo-800 text-sm rounded-lg shadow-inner">
                <p class="text-gray-500">Seleccione un tipo de multa para ver los detalles.</p>
            </div>
        </div>

        <div>
            <label for="capturista" class="block text-sm font-bold text-gray-700 mb-1">Registrado Por</label>
            <select id="capturista" name="capturista" required class="w-full">
                <option value="">Cargando capturistas...</option>
            </select>
        </div>

        <div>
            <label for="fechaAplicacion" class="block text-sm font-bold text-gray-700 mb-1">Fecha de Aplicación</label>
            <input type="date" id="fechaAplicacion" name="fechaAplicacion" required class="block w-full shadow-sm sm:text-sm border-gray-300 border rounded-md p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
        </div>

        <button id="submitButton" type="submit" disabled class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
            Registrar Multa
        </button>
    </form>
</div>

<script>
    // Variables globales
    let globalUnits = [];
    let globalFines = [];
    let globalCapturistas = [];

    $(document).ready(function() {
        // Carga la lista de unidades, capturistas y multas al inicio
        google.script.run.withSuccessHandler(initializeForm).getUnitList();
        google.script.run.withSuccessHandler(handleCapturistas).getCapturistaList();
        google.script.run.withSuccessHandler(handleFines).getFineConfig();

        // Establece la fecha predeterminada como hoy
        const today = new Date().toISOString().substring(0, 10);
        $('#fechaAplicacion').val(today);
    });

    function handleCapturistas(result) {
        if (result.error) {
            $('#messages').append('<div class="text-red-600 font-bold mb-2">Error al cargar capturistas: ' + result.error + '</div>');
            return;
        }
        globalCapturistas = result.capturistas || [];
        const $capturistaSelect = $('#capturista');
        
        $capturistaSelect.empty().append('<option value="">Seleccione Capturista</option>');
        
        globalCapturistas.forEach(c => {
            $capturistaSelect.append(`<option value="${c}">${c}</option>`);
        });
        
        if (globalCapturistas.length > 0) {
            $capturistaSelect.val(globalCapturistas[0]);
        }

        // Inicializar Select2 en capturistas
        $capturistaSelect.select2({ width: '100%' });
    }
    
    function handleFines(result) {
        if (result.error) {
            $('#messages').append('<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded relative mb-2 font-bold">ADVERTENCIA: ' + result.error + ' Por favor, cree la hoja CONFIG_MULTAS.</div>');
            return;
        }
        globalFines = result.fines || [];
        const $fineSelect = $('#idMulta');
        
        $fineSelect.empty().append('<option value="">Seleccione Tipo de Multa</option>');
        
        globalFines.forEach(f => {
            $fineSelect.append(`<option value="${f.idMulta}">${f.concepto} ($${f.montoBase.toFixed(2)})</option>`);
        });

        // Inicializar Select2 en multas y escuchar cambios
        $fineSelect.select2({ width: '100%', placeholder: "Buscar multa..." });
        $fineSelect.on('change', updateFineDetails);
        
        updateFineDetails();
    }

    function initializeForm(result) {
        const $unitSelect = $('#idUnidad');
        
        if (result.error) {
            $('#messages').append('<div class="text-red-600 font-bold mb-2">Error: ' + result.error + '</div>');
            return;
        }
        
        globalUnits = result.units || [];
        
        if (globalUnits.length === 0) {
            $('#messages').append('<div class="text-red-600 font-bold mb-2">No hay unidades registradas.</div>');
            return;
        }

        $unitSelect.empty().append('<option value="">Seleccione Unidad</option>');
        
        globalUnits.forEach(unit => {
            $unitSelect.append(`<option value="${unit.id}">${unit.departamento} (${unit.propietario})</option>`);
        });

        // Inicializar Select2 en unidades con búsqueda y escuchar cambios
        $unitSelect.select2({
            width: '100%',
            placeholder: "Buscar unidad o departamento...",
            language: { noResults: function() { return "No se encontró la unidad"; } }
        });
        $unitSelect.on('change', updateFineDetails);
    }

    function updateFineDetails() {
        const idMulta = $('#idMulta').val();
        const idUnidad = $('#idUnidad').val();
        const $fineDetailsDiv = $('#fineDetails');
        const $submitButton = $('#submitButton');
        
        if (!idMulta) {
            $fineDetailsDiv.html('<p class="text-gray-500 font-medium">Seleccione un tipo de multa para ver los detalles.</p>');
            $submitButton.prop('disabled', true);
            return;
        }
        
        const fine = globalFines.find(f => f.idMulta === idMulta);
        
        if (fine) {
            const ppText = fine.tasaProntoPago > 0 ? 
                `<span class="text-green-600 font-bold">Descuento PP: ${(fine.tasaProntoPago * 100).toFixed(0)}% (Día ${fine.diaLimitePP})</span>` :
                '<span class="text-gray-600">No aplica Descuento por PP.</span>';
            
            $fineDetailsDiv.html(`
                <p><strong>Monto Base:</strong> <span class="text-lg">$${fine.montoBase.toFixed(2)}</span></p>
                <p class="mt-1">${ppText}</p>
            `);
            
            // Habilita el botón solo si la unidad y la multa han sido seleccionadas
            $submitButton.prop('disabled', idUnidad === "" || idUnidad === null);
        } else {
             $fineDetailsDiv.html('<p class="text-red-600 font-bold">Error: Configuración de multa no encontrada.</p>');
             $submitButton.prop('disabled', true);
        }
    }
    
    function validateForm() {
        const idUnidad = $('#idUnidad').val();
        const idMulta = $('#idMulta').val();
        const capturista = $('#capturista').val();
        
        return idUnidad && idMulta && capturista;
    }

    function submitFine(event) {
        event.preventDefault();
        const $messagesDiv = $('#messages');
        const $submitButton = $('#submitButton');
        
        if (!validateForm()) {
            $messagesDiv.html('<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded relative font-bold mb-4">Por favor, complete todos los campos requeridos.</div>');
            return;
        }
        
        // Confirmación visual
        const deptoText = $('#idUnidad option:selected').text();
        const multaText = $('#idMulta option:selected').text();
        
        if(!confirm(`¿Desea aplicar la multa de ${multaText}\na la unidad: ${deptoText}?`)) {
            return;
        }
        
        $submitButton.prop('disabled', true).text('Procesando...');
        $messagesDiv.html('<div class="bg-blue-100 text-blue-700 px-4 py-3 rounded relative font-bold mb-4">Registrando multa en la base de datos...</div>');

        const fineData = {
            idUnidad: $('#idUnidad').val(),
            idMulta: $('#idMulta').val(),
            capturista: $('#capturista').val(),
            fechaAplicacionStr: $('#fechaAplicacion').val()
        };

        google.script.run
            .withSuccessHandler(function(response) {
                if (response.success) {
                    $messagesDiv.html(`<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative font-bold mb-4">✅ ${response.message}</div>`);
                    
                    // Resetear formulario
                    document.getElementById('fineForm').reset();
                    $('#idUnidad').val(null).trigger('change');
                    $('#idMulta').val(null).trigger('change');
                    $('#fechaAplicacion').val(new Date().toISOString().substring(0, 10));
                    
                } else {
                    $messagesDiv.html(`<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative font-bold mb-4">❌ Error: ${response.message}</div>`);
                }
                $submitButton.prop('disabled', false).text('Registrar Multa');
            })
            .withFailureHandler(function(error) {
                $messagesDiv.html(`<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative font-bold mb-4">❌ Error de conexión: ${error}</div>`);
                $submitButton.prop('disabled', false).text('Registrar Multa');
            })
            .processFineRegistration(fineData);
    }
</script>

</body>
</html>
