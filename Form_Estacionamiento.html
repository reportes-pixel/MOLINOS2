<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        
        /* 📱 Ajustes base de Select2 para CELULAR */
        .select2-container .select2-selection--single {
            height: 44px !important; 
            border: 1px solid #d1d5db !important;
            border-radius: 0.5rem !important;
            display: flex;
            align-items: center;
            font-size: 1rem;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 42px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 44px !important;
            color: #374151 !important; 
            padding-left: 0.75rem !important;
        }

        /* 💻 Ajustes automáticos de Select2 cuando detecta una PC */
        @media (min-width: 768px) {
            .select2-container .select2-selection--single {
                height: 52px !important; 
                font-size: 1.125rem;
            }
            .select2-container--default .select2-selection--single .select2-selection__rendered {
                line-height: 52px !important;
            }
            .select2-container--default .select2-selection--single .select2-selection__arrow {
                height: 50px !important;
            }
        }

        .select2-dropdown {
            border-radius: 0.375rem !important;
            border: 1px solid #d1d5db !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
    </style>
</head>
<body class="p-4 md:p-10 bg-gray-50 min-h-screen flex justify-center items-start pt-6 md:pt-16">

    <div class="w-full max-w-md md:max-w-2xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border-t-8 border-blue-500 h-fit transition-all duration-300">
        
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2 flex items-center">
            <span class="text-blue-600 mr-2">🚗</span> Renta de Estacionamiento
        </h2>
        <p class="text-sm md:text-base text-gray-500 mb-6 border-b pb-4">
            El sistema cobrará automáticamente esta cuota junto con la mensualidad mientras el contrato esté vigente.
        </p>
        
        <div id="resultado" class="mb-4"></div>

        <form id="estForm" class="space-y-5 md:space-y-6">
            
            <div>
                <label for="idUnidad" class="block text-sm md:text-base font-bold text-gray-700 mb-2">Unidad:</label>
                <select id="idUnidad" required class="w-full">
                    <option value="">Cargando unidades...</option>
                </select>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 md:gap-6">
                <div class="w-full md:w-1/2">
                    <label for="fechaInicio" class="block text-sm md:text-base font-bold text-gray-700 mb-2">Mes Inicio:</label>
                    <input type="month" id="fechaInicio" required 
                           class="block w-full shadow-sm sm:text-sm md:text-lg border-gray-300 border rounded-lg p-3 md:p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div class="w-full md:w-1/2">
                    <label for="fechaTermino" class="block text-sm md:text-base font-bold text-gray-700 mb-2">Mes Término:</label>
                    <input type="month" id="fechaTermino" required 
                           class="block w-full shadow-sm sm:text-sm md:text-lg border-gray-300 border rounded-lg p-3 md:p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 md:gap-6">
                <div class="w-full md:w-1/2">
                    <label for="monto" class="block text-sm md:text-base font-bold text-gray-700 mb-2">Costo Mensual ($):</label>
                    <input type="number" id="monto" min="1" step="0.01" value="500.00" required 
                           class="block w-full shadow-sm sm:text-sm md:text-xl border-gray-300 border rounded-lg p-3 md:p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition font-bold text-gray-800">
                </div>
                <div class="w-full md:w-1/2">
                    <label for="capturista" class="block text-sm md:text-base font-bold text-gray-700 mb-2">Capturista:</label>
                    <select id="capturista" required 
                            class="block w-full shadow-sm sm:text-sm md:text-lg border-gray-300 border rounded-lg p-3 md:p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition bg-white">
                        <option value="">Cargando...</option>
                    </select>
                </div>
            </div>
            
            <button id="btn_procesar" type="submit" class="w-full flex justify-center mt-2 py-3 md:py-4 px-4 border border-transparent rounded-lg shadow-md md:text-lg font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
                CREAR CONTRATO
            </button>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            // Cargar unidades y activar Select2
            google.script.run.withSuccessHandler(res => {
                const $sel = $('#idUnidad');
                $sel.empty().append('<option value="">Seleccione Unidad...</option>');
                
                if (res.units && res.units.length > 0) {
                    res.units.forEach(u => $sel.append(`<option value="${u.id}">${u.departamento} (${u.propietario})</option>`));
                }

                $sel.select2({
                    width: '100%',
                    placeholder: "Buscar unidad...",
                    language: { noResults: function() { return "No se encontró la unidad"; } }
                });
            }).getUnitList();
            
            // Cargar capturistas
            google.script.run.withSuccessHandler(res => {
                const $sel = $('#capturista');
                $sel.empty();
                if (res.capturistas && res.capturistas.length > 0) {
                    res.capturistas.forEach(c => $sel.append(`<option value="${c}">${c}</option>`));
                }
            }).getCapturistaList();
        });

        $('#estForm').on('submit', function(e) {
            e.preventDefault();
            
            // Validar Select2
            const idUnidad = $('#idUnidad').val();
            if(!idUnidad) {
                $('#resultado').html('<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 md:text-lg rounded relative font-bold">Por favor, seleccione una unidad.</div>');
                return;
            }

            $('#btn_procesar').prop('disabled', true).text('Guardando...');
            $('#resultado').html('<div class="bg-blue-100 text-blue-700 px-4 py-3 rounded relative md:text-lg font-bold">⏳ Procesando contrato en la base de datos...</div>');
            
            const data = {
                idUnidad: idUnidad,
                fechaInicio: $('#fechaInicio').val() + "-01",
                fechaTermino: $('#fechaTermino').val() + "-28", 
                monto: $('#monto').val(),
                capturista: $('#capturista').val()
            };

            google.script.run
                .withSuccessHandler(res => {
                    if(res.success) {
                        $('#resultado').html(`<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 md:text-lg rounded relative font-bold">✅ ${res.message}</div>`);
                        $('#estForm')[0].reset();
                        $('#idUnidad').val(null).trigger('change'); // Limpiar Select2
                    } else {
                        $('#resultado').html(`<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 md:text-lg rounded relative font-bold">❌ Error: ${res.message}</div>`);
                    }
                    $('#btn_procesar').prop('disabled', false).text('CREAR CONTRATO');
                })
                .withFailureHandler(error => {
                    $('#resultado').html(`<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 md:text-lg rounded relative font-bold">❌ Error de conexión: ${error}</div>`);
                    $('#btn_procesar').prop('disabled', false).text('CREAR CONTRATO');
                })
                .procesarRentaEstacionamiento(data);
        });
    </script>
</body>
</html>
