<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Arial', sans-serif; padding: 10px; }
        .select2-container .select2-selection--single { height: 42px !important; border: 2px solid #e5e7eb !important; border-radius: 0.5rem !important; display: flex; align-items: center; }
        .tabla-contable { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.8rem; color: #1f2937; }
        .tabla-contable th, .tabla-contable td { border: 1px solid #9ca3af; padding: 6px 8px; }
        .tabla-contable th { background-color: #f3f4f6; font-weight: bold; text-transform: uppercase; text-align: left; }
        .titulo-seccion { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.5rem; color: #111827; border-bottom: 2px solid #111827; padding-bottom: 2px; }
        
        @media print { 
            body { background-color: white; padding: 0; }
            .no-print { display: none !important; }
            .salto-pagina { page-break-after: always; display: block; clear: both; }
            .evitar-salto { page-break-inside: avoid; }
            .grid-cols-3 { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 10px !important; }
        }
    </style>
</head>
<body class="p-2 md:p-6">

    <div id="loader" class="hidden fixed inset-0 bg-white/90 z-[9999] flex flex-col items-center justify-center">
        <i class="fas fa-spinner fa-spin text-slate-700 fa-3x mb-4"></i>
        <p class="text-slate-900 font-bold">Procesando auditoría y recalculando saldos reales...</p>
    </div>

    <div id="pantallaBusqueda" class="max-w-md mx-auto bg-white rounded-xl shadow-md border-t-4 border-slate-800 p-6 no-print">
        <h2 class="text-xl font-bold text-slate-800 mb-1"><i class="fas fa-file-invoice-dollar mr-2 text-slate-500"></i>Auditoría de Estados de Cuenta</h2>
        <p class="text-sm text-gray-500 mb-5">Administración Molinos Real II</p>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Seleccionar Unidad</label>
                <select id="unidadSelect" class="w-full"></select>
            </div>
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg flex items-start gap-3 mt-4">
                <input type="checkbox" id="checkExcel" class="mt-1 w-5 h-5 text-blue-600 rounded border-gray-300 cursor-pointer">
                <label for="checkExcel" class="text-sm font-bold text-slate-800 cursor-pointer">Generar respaldo en Excel</label>
            </div>
        </div>

        <button id="btnGenerar" onclick="enviarDatos()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transition shadow">
            <i class="fas fa-search mr-2"></i> GENERAR REPORTE
        </button>
    </div>

    <div id="pantallaResultado" class="hidden max-w-6xl mx-auto bg-white p-6 md:p-10 shadow-lg border border-gray-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4 no-print">
            <button onclick="volver()" class="text-gray-600 font-bold hover:bg-gray-100 px-3 py-1 border border-gray-300 rounded transition">
                <i class="fas fa-arrow-left mr-2"></i> Volver
            </button>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-700 text-white px-4 py-2 rounded text-sm font-bold flex items-center shadow hover:bg-slate-800 transition">
                    <i class="fas fa-print mr-2"></i> Imprimir Reporte
                </button>
                <button id="btnDescargarPDF" onclick="descargarPDFDirecto()" class="bg-red-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center shadow hover:bg-red-700 transition">
                    <i class="fas fa-file-pdf mr-2"></i> Descargar PDF
                </button>
            </div>
        </div>
        <div id="contenedorDinamico"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#unidadSelect').select2({ placeholder: "Cargando..." });
            google.script.run.withSuccessHandler(unidades => {
                const select = $('#unidadSelect');
                select.empty().append(new Option("TODOS (Resumen Global + Detallado)", "TODOS"));
                unidades.forEach(u => select.append(new Option(`Unidad: ${u}`, u)));
                select.select2();
            }).obtenerUnidadesParaEstadoCuenta();
        });

        function enviarDatos() {
            const unidad = $('#unidadSelect').val();
            if (!unidad) return;
            $('#loader').removeClass('hidden');
            
            // Ocultar PDF si es masivo para evitar caída del servidor
            if(unidad === "TODOS") { $('#btnDescargarPDF').addClass('hidden'); } 
            else { $('#btnDescargarPDF').removeClass('hidden'); }

            google.script.run
                .withSuccessHandler(dibujarPDF)
                .withFailureHandler(err => { alert(err.message); volver(); })
                .generarEstadoCuentaWebApp(unidad, document.getElementById('checkExcel').checked);
        }

        function dibujarPDF(res) {
            if(!res.success) { alert(res.message); volver(); return; }
            $('#loader').addClass('hidden');
            $('#pantallaBusqueda').addClass('hidden');
            $('#pantallaResultado').removeClass('hidden');

            const formatCurr = (v) => `$${Number(v || 0).toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            let htmlContenido = "";

            // 1. RESUMEN GLOBAL CORREGIDO (CALCULO DESDE HISTORIAL)
            if (res.isTodos) {
                let filasResumen = res.detalles.map(d => {
                    const ultimoAcumulado = d.historial.length > 0 ? d.historial[d.historial.length - 1].saldo : 0;
                    const deudaReal = ultimoAcumulado > 0 ? ultimoAcumulado : 0;
                    const saldoFavorReal = ultimoAcumulado < 0 ? Math.abs(ultimoAcumulado) : 0;

                    return `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="text-center font-bold text-gray-800">${d.unidad}</td>
                            <td class="text-right">${formatCurr(d.totalCargos)}</td>
                            <td class="text-right text-blue-600 font-bold">${formatCurr(saldoFavorReal)}</td>
                            <td class="text-right font-bold text-red-600">${formatCurr(deudaReal)}</td>
                        </tr>`;
                }).join('');

                htmlContenido += `
                <div class="salto-pagina">
                    <h1 class="text-2xl font-black text-gray-900 uppercase mb-2">Resumen General de Auditoría</h1>
                    <p class="text-sm text-gray-500 mb-6">Saldos finales calculados según historial real de movimientos.</p>
                    <table class="tabla-contable">
                        <thead>
                            <tr>
                                <th class="text-center">Unidad</th>
                                <th class="text-right">Total Cargos</th>
                                <th class="text-right">Tu Saldo a Favor</th>
                                <th class="text-right">Deuda Pendiente</th>
                            </tr>
                        </thead>
                        <tbody>${filasResumen}</tbody>
                    </table>
                </div>`;
            }

            // 2. DETALLE INDIVIDUAL (3 COLUMNAS CORREGIDAS)
            res.detalles.forEach((d, idx) => {
                const ultimoAcumulado = d.historial.length > 0 ? d.historial[d.historial.length - 1].saldo : 0;
                const deudaFinal = ultimoAcumulado > 0 ? ultimoAcumulado : 0;
                const saldoFavorFinal = ultimoAcumulado < 0 ? Math.abs(ultimoAcumulado) : 0;

                let filasHist = d.historial.map(t => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="text-gray-500">${t.fecha}</td>
                        <td class="font-bold">${t.concepto}</td>
                        <td class="text-right">${t.cargo > 0 ? formatCurr(t.cargo) : '-'}</td>
                        <td class="text-right text-green-700">${t.pago > 0 ? formatCurr(t.pago) : '-'}</td>
                        <td class="text-right font-bold ${t.saldo < 0 ? 'text-blue-700 italic' : ''}">${formatCurr(t.saldo)}</td>
                    </tr>`).join('');

                let claseSalto = (res.isTodos && idx < res.detalles.length - 1) ? 'salto-pagina' : '';

                htmlContenido += `
                <div class="evitar-salto ${claseSalto} mt-8">
                    <div class="flex justify-between items-end mb-6">
                        <div>
                            <h1 class="text-2xl font-black text-gray-900 uppercase">Estado de Cuenta</h1>
                            <h2 class="text-md font-bold text-gray-600 uppercase mt-1">Molinos Real II</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-500 font-bold uppercase mb-1">Unidad Correspondiente</p>
                            <p class="text-2xl font-black text-blue-700 bg-blue-50 border border-blue-200 px-4 py-1 rounded inline-block">${d.unidad}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-8">
                        <div class="border border-gray-300 p-3 rounded bg-gray-50 text-center">
                            <p class="text-[10px] font-bold text-gray-500 uppercase">Total Cargos</p>
                            <p class="text-lg font-bold text-gray-800">${formatCurr(d.totalCargos)}</p>
                        </div>
                        <div class="border-2 ${deudaFinal > 0 ? 'border-red-500 bg-red-50 text-red-800' : 'border-green-500 bg-green-50 text-green-800'} p-3 rounded text-center">
                            <p class="text-[10px] font-bold uppercase">Deuda Pendiente</p>
                            <p class="text-xl font-black">${formatCurr(deudaFinal)}</p>
                        </div>
                        <div class="border border-blue-200 p-3 rounded bg-blue-50 text-center">
                            <p class="text-[10px] font-bold text-blue-600 uppercase">Tu Saldo a Favor</p>
                            <p class="text-lg font-bold text-blue-700">${formatCurr(saldoFavorFinal)}</p>
                        </div>
                    </div>

                    <h3 class="titulo-seccion">Historial Cronológico</h3>
                    <table class="tabla-contable">
                        <thead><tr>
                            <th class="w-1/6">Fecha</th>
                            <th class="w-1/2">Concepto</th>
                            <th class="text-right">Cargo ($)</th>
                            <th class="text-right">Abono ($)</th>
                            <th class="text-right">Acumulado</th>
                        </tr></thead>
                        <tbody>${filasHist}</tbody>
                    </table>
                </div>`;
            });

            document.getElementById('contenedorDinamico').innerHTML = htmlContenido;
        }

        function descargarPDFDirecto() {
            const unidad = $('#unidadSelect').val();
            if(unidad === "TODOS") return;
            const htmlContenido = document.getElementById('contenedorDinamico').innerHTML;
            $('#loader').removeClass('hidden');

            google.script.run
                .withSuccessHandler(base64 => {
                    const link = document.createElement('a');
                    link.href = 'data:application/pdf;base64,' + base64;
                    link.download = "Estado_Cuenta_" + unidad + ".pdf";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    $('#loader').addClass('hidden');
                })
                .withFailureHandler(err => { alert(err); $('#loader').addClass('hidden'); })
                .generarPDFAdministrador(unidad, htmlContenido);
        }

        function volver() {
            $('#pantallaResultado').addClass('hidden');
            $('#pantallaBusqueda').removeClass('hidden');
            $('#loader').addClass('hidden');
        }
    </script>
</body>
</html>
